<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom Bouquet</title>
<style>
  :root {
    --paper-1: #f7c9d8;
    --paper-2: #f1a7bf;
    --ribbon: #fbeff3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(135deg, #fdeef3 0%, #f9d9e5 60%, #fce8ef 100%);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Button ---------- */
  .again {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .85);
    color: #c2185b;
    font: 700 15px/1 inherit;
    box-shadow: 0 6px 18px rgba(194, 24, 91, .18);
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .again:hover  { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(194, 24, 91, .25); }
  .again:active { transform: scale(.96); }
  .again .ic { display: inline-block; transition: rotate .7s ease; }

  /* ---------- Stage ---------- */
  .box   { position: relative; width: calc(420px * var(--fit, 1)); height: calc(570px * var(--fit, 1)); }
  .stage { position: absolute; left: 0; top: 0; width: 420px; height: 570px; transform-origin: 0 0; scale: var(--fit, 1); }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #leaves, #filler { z-index: 1; }
  #stems   { z-index: 2; }
  #flowers { z-index: 3; }

  /* ---------- Stems ---------- */
  .stem {
    position: absolute;
    left: 210px;
    width: 4px;
    margin-left: -2px;
    border-radius: 3px;
    background: linear-gradient(90deg, #2f7d46, #7fcf86 50%, #2f7d46);
    transform-origin: 50% 100%;
    scale: 1 0;
  }
  .stem.thin { width: 1.6px; margin-left: -.8px; background: #8fcf9a; }
  .go .stem  { animation: grow 1s ease-out calc(.2s + var(--j) * 30ms) both; }
  @keyframes grow { to { scale: 1 1; } }

  /* ---------- Leaves ---------- */
  .leaf {
    position: absolute;
    border-radius: 0 100% 0 100%;
    background:
      linear-gradient(to bottom right, transparent 47%, rgba(255,255,255,.4) 50%, transparent 53%),
      linear-gradient(145deg, #8fd99a, #2e8b57);
    box-shadow: 0 2px 4px rgba(20, 80, 40, .25);
    scale: 0;
  }
  .go .leaf { animation: pop .9s ease-out calc(.9s + var(--j) * 80ms) both; }

  /* ---------- Baby's breath ---------- */
  .gyp {
    position: absolute;
    width: 8px; height: 8px;
    margin: -4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #f7e8ee 70%);
    box-shadow: 0 1px 2px rgba(120, 20, 60, .25);
    scale: 0;
  }
  .go .gyp { animation: open .6s ease-out calc(1.6s + var(--j) * 30ms) both; }

  /* ---------- Flowers ---------- */
  .flower {
    position: absolute;
    scale: 0;
    filter: drop-shadow(0 4px 6px rgba(120, 20, 60, .28));
  }
  .go .flower {
    animation:
      pop 1.1s cubic-bezier(.2, 1.3, .4, 1) var(--fd) both,
      bob 4.5s ease-in-out calc(var(--fd) + 1.2s) infinite;
  }

  .petal {
    position: absolute;
    left: 50%; top: 50%;
    transform-origin: 0 0;
    scale: 0;
    border-radius: 50% 50% 44% 44% / 58% 58% 42% 42%;
    background: radial-gradient(ellipse at 50% 100%, var(--c3) 0%, var(--c2) 50%, var(--c1) 100%);
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, .55),
      inset 0 -3px 6px rgba(80, 0, 30, .18),
      0 1px 3px rgba(90, 10, 40, .28);
  }
  .petal.dz {
    border-radius: 50%;
    background: linear-gradient(0deg, var(--c3) 0%, var(--c2) 38%, var(--c1) 100%);
    box-shadow: inset 0 1px 2px rgba(255,255,255,.7), 0 1px 2px rgba(90,10,40,.25);
  }
  .go .petal {
    animation: open .9s cubic-bezier(.2, 1.2, .4, 1) calc(var(--fd) + var(--k) * 90ms + 150ms) both;
  }

  .core, .eye {
    position: absolute;
    left: 50%; top: 50%;
    border-radius: 50%;
    scale: 0;
  }
  .core {
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(60, 0, 25, .25) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 40% 35%, var(--c2), var(--c3) 75%);
    box-shadow: inset 0 0 6px rgba(40, 0, 20, .5);
  }
  .eye {
    background:
      radial-gradient(circle, rgba(130, 70, 0, .35) 1px, transparent 1.6px) 0 0 / 5px 5px,
      radial-gradient(circle at 38% 32%, #ffe27a, #ffb703 60%, #e08600);
    box-shadow: inset 0 -2px 4px rgba(120, 60, 0, .35), 0 1px 3px rgba(0, 0, 0, .25);
  }
  .go .core, .go .eye { animation: open .6s ease-out calc(var(--fd) + 100ms) both; }

  /* ---------- Wrapping paper ---------- */
  .paper-back, .paper-front, .flap-shadow, .band {
    position: absolute;
    left: 30px; top: 290px;
    width: 360px; height: 250px;
    translate: 0 30px;
    opacity: 0;
  }
  .paper-back {
    z-index: 1;
    clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
    background: linear-gradient(180deg, #e58aa8 0%, #f2a9c1 45%, #f7c6d6 100%);
  }
  .paper-front {
    z-index: 4;
    clip-path: polygon(0 0, 50% 12%, 100% 0, 60% 100%, 40% 100%);
    background:
      linear-gradient(100deg,
        transparent 8%, rgba(255,255,255,.55) 20%, transparent 34%,
        rgba(255,255,255,.18) 52%, transparent 60%,
        rgba(255,255,255,.5) 78%, transparent 92%),
      linear-gradient(180deg, var(--paper-1), var(--paper-2) 70%, #ec93b0);
  }
  .flap-shadow {
    z-index: 5;
    filter: drop-shadow(-4px 3px 5px rgba(160, 40, 90, .3));
  }
  .flap-right {
    width: 100%; height: 100%;
    clip-path: polygon(50% 12%, 100% 0, 60% 100%, 44% 100%);
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%),
      linear-gradient(110deg, #fdeaf1 0%, #f9d3df 45%, #f4b9cd 100%);
  }
  .band {
    z-index: 6;
    left: 111px; top: 430px;
    width: 198px; height: 14px;
    clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
    background: linear-gradient(180deg, #ffffff, #f0cfda);
  }
  .go .paper-back, .go .paper-front, .go .flap-shadow { animation: rise .8s ease-out both; }
  .go .band { animation: rise .8s ease-out .2s both; }

  /* ---------- Bow ---------- */
  .bow { position: absolute; left: 210px; top: 438px; z-index: 7; scale: 0; }
  .bow i { position: absolute; display: block; }
  .go .bow { animation: pop .8s cubic-bezier(.2, 1.4, .4, 1) 2.3s both; }

  .tl {
    width: 26px; height: 62px; top: 6px;
    background: linear-gradient(180deg, #fff, #f1d3de);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
    transform-origin: 50% 0;
  }
  .tl.l { left: -22px; rotate: 9deg; }
  .tl.r { left: -4px;  rotate: -9deg; }

  .lp {
    width: 64px; height: 44px; top: -30px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 35%, #fff 0%, var(--ribbon) 55%, #ecc6d3 100%);
    box-shadow: inset 0 -4px 8px rgba(190, 100, 130, .25), 0 3px 6px rgba(150, 40, 90, .2);
  }
  .lp::after {
    content: "";
    position: absolute; inset: 10px 12px;
    border-radius: 50%;
    background: radial-gradient(ellipse, #f1c9d6, #fadfe8);
    box-shadow: inset 0 3px 5px rgba(150, 40, 90, .25);
  }
  .lp.l { left: -70px; rotate: -8deg; transform-origin: 100% 100%; }
  .lp.r { left: 6px;   rotate: 8deg;  transform-origin: 0 100%; }

  .kn {
    width: 28px; height: 28px; left: -14px; top: -12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #f6e1e9 60%, #e5b8c9);
    box-shadow: 0 2px 5px rgba(150, 40, 90, .3);
  }

  /* ---------- Sparkles & falling petals ---------- */
  .sp { position: absolute; width: 16px; height: 16px; margin: -8px; z-index: 0; animation: tw 2.6s ease-in-out var(--dl) infinite; }
  .sp::before, .sp::after {
    content: ""; position: absolute; background: #fff; border-radius: 2px;
    box-shadow: 0 0 6px rgba(255, 150, 190, .9);
  }
  .sp::before { left: 7px; top: 0; width: 2px; height: 16px; }
  .sp::after  { left: 0; top: 7px; width: 16px; height: 2px; }

  .fp {
    position: absolute; top: -20px; z-index: 8;
    width: 12px; height: 16px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(160deg, #ffc2d6, #f0709a);
    opacity: 0;
  }
  .go .fp { animation: fall var(--t) linear var(--dl) infinite; }

  /* ---------- Keyframes ---------- */
  @keyframes pop  { from { scale: 0; rotate: -35deg; } to { scale: 1; rotate: 0deg; } }
  @keyframes open { from { scale: 0; } to { scale: 1; } }
  @keyframes rise { to { translate: 0 0; opacity: 1; } }
  @keyframes bob  { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  @keyframes tw   { 0%, 100% { scale: .4; opacity: .3; } 50% { scale: 1; opacity: 1; } }
  @keyframes fall {
    0%   { translate: 0 -20px; rotate: 0deg; opacity: 0; }
    10%  { opacity: .85; }
    100% { translate: var(--dx) 620px; rotate: 540deg; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>

<button class="again" id="again" type="button"><span class="ic" id="ic">↻</span> Bloom Again</button>

<div class="box" id="box">
  <div class="stage" id="stage">
    <div id="sparkles" class="layer"></div>
    <div id="leaves"   class="layer"></div>
    <div id="filler"   class="layer"></div>
    <div class="paper-back"></div>
    <div id="stems"    class="layer"></div>
    <div id="flowers"  class="layer"></div>
    <div class="paper-front"></div>
    <div class="flap-shadow"><div class="flap-right"></div></div>
    <div class="band"></div>
    <div class="bow">
      <i class="tl l"></i><i class="tl r"></i>
      <i class="lp l"></i><i class="lp r"></i>
      <i class="kn"></i>
    </div>
    <div id="fall" class="layer"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const mk = (cls, css, parent) => {
    const d = document.createElement('div');
    d.className = cls;
    if (css) d.style.cssText = css;
    if (parent) parent.appendChild(d);
    return d;
  };

  const AX = 210, AY = 470;               // where all stems meet

  // colour sets: [tip, middle, base]
  const PAL = {
    blush: ['#fff1f5', '#f7bfd2', '#e27aa0'],
    hot:   ['#ff8db3', '#ee3f7b', '#a8124a'],
    deep:  ['#f25c86', '#c91e57', '#7a0c33'],
    peach: ['#ffe9df', '#ffbfa8', '#ee8b76'],
    dw:    ['#ffffff', '#fffaf2', '#ecd9b8'],
    dp:    ['#ffeaf1', '#ffd3e0', '#f2a6bf']
  };

  // type, x, y, size, palette
  const FLOWERS = [
    ['daisy', 210,  62,  80, 'dw'],
    ['daisy', 130,  98,  86, 'dp'],
    ['daisy', 290,  98,  86, 'dw'],
    ['rose',  210, 138,  96, 'blush'],
    ['rose',   72, 152,  86, 'hot'],
    ['rose',  348, 152,  86, 'hot'],
    ['daisy', 140, 172,  88, 'dw'],
    ['daisy', 280, 172,  88, 'dp'],
    ['rose',   92, 205,  70, 'deep'],
    ['rose',  328, 205,  70, 'peach'],
    ['rose',  210, 208, 106, 'deep'],
    ['rose',  128, 258,  94, 'peach'],
    ['rose',  292, 258,  94, 'blush'],
    ['daisy',  58, 258,  72, 'dw'],
    ['daisy', 362, 258,  72, 'dp'],
    ['rose',  210, 285,  96, 'hot']
  ].sort((a, b) => a[2] - b[2]);

  function stem(parent, x, y, j, thin) {
    const dx = x - AX, dy = AY - y;
    const len = Math.hypot(dx, dy);
    const ang = Math.atan2(dx, dy) * 180 / Math.PI;
    mk('stem' + (thin ? ' thin' : ''),
       `top:${AY - len}px;height:${len}px;--j:${j};transform:rotate(${ang}deg)`, parent);
  }

  function petal(parent, w, h, d, a, k, cls) {
    mk('petal' + (cls ? ' ' + cls : ''),
       `width:${w}px;height:${h}px;--k:${k};` +
       `transform:rotate(${a}deg) translateY(${-d}px) translate(-50%,-50%)`, parent);
  }

  function rose(f, s, i) {
    const jitter = (i * 37) % 60;
    // [count, width, height, distance from centre, angle offset, open order]
    [[6, .52, .56, .25,  0, 3],
     [5, .46, .50, .17, 18, 2],
     [4, .36, .40, .10, 40, 1],
     [3, .26, .30, .05, 15, 0]
    ].forEach(([n, w, h, d, off, k]) => {
      for (let p = 0; p < n; p++) {
        petal(f, w * s, h * s, d * s, off + jitter + p * 360 / n, k);
      }
    });
    const c = .3 * s;
    mk('core', `width:${c}px;height:${c}px;margin:${-c / 2}px 0 0 ${-c / 2}px`, f);
  }

  function daisy(f, s, i) {
    const jitter = (i * 23) % 25;
    [[14, .17, .42, .27, 0, 1],
     [14, .16, .38, .24, 180 / 14, 0]
    ].forEach(([n, w, h, d, off, k]) => {
      for (let p = 0; p < n; p++) {
        petal(f, w * s, h * s, d * s, off + jitter + p * 360 / n, k, 'dz');
      }
    });
    const e = .27 * s;
    mk('eye', `width:${e}px;height:${e}px;margin:${-e / 2}px 0 0 ${-e / 2}px`, f);
  }

  // ----- build flowers + stems -----
  const flowersEl = $('flowers'), stemsEl = $('stems');
  FLOWERS.forEach(([type, x, y, s, pal], i) => {
    const c = PAL[pal];
    const f = mk('flower',
      `left:${x}px;top:${y}px;width:${s}px;height:${s}px;margin:${-s / 2}px 0 0 ${-s / 2}px;` +
      `--fd:${500 + i * 100}ms;--c1:${c[0]};--c2:${c[1]};--c3:${c[2]};` +
      `transform:rotate(${(x - AX) * 0.1}deg)`, flowersEl);
    (type === 'rose' ? rose : daisy)(f, s, i);
    stem(stemsEl, x, y, i, false);
  });

  // ----- leaves: x, y, width, rotation -----
  [[ 32, 215, 96,  -6], [ 55, 128, 86,  18], [105,  52, 72,  43],
   [388, 215, 96, -47], [365, 128, 86, -72], [315,  52, 72, -96],
   [ 40, 288, 84, -40], [380, 288, 84, -17]
  ].forEach(([x, y, w, r], j) => {
    mk('leaf',
      `left:${x}px;top:${y}px;width:${w}px;height:${w / 2}px;` +
      `margin:${-w / 4}px 0 0 ${-w / 2}px;--j:${j};transform:rotate(${r}deg)`, $('leaves'));
  });

  // ----- baby's breath around the edge of the dome -----
  for (let i = 0; i < 28; i++) {
    const t = Math.PI * (0.9 + 1.2 * i / 27);
    const rx = 190 + 22 * Math.sin(i * 2.3);
    const ry = 170 + 14 * Math.cos(i * 1.7);
    const x = 210 + rx * Math.cos(t), y = 185 + ry * Math.sin(t);
    stem($('filler'), x, y, i % 10, true);
    [[0, 0], [9, -6], [-8, 7]].forEach(([dx, dy], q) => {
      mk('gyp', `left:${x + dx}px;top:${y + dy}px;--j:${i + q}`, $('filler'));
    });
  }

  // ----- sparkles & falling petals -----
  [[60, 40], [358, 56], [112, 12], [312, 18], [24, 126], [396, 134], [44, 330], [380, 350]]
    .forEach(([x, y], i) => mk('sp', `left:${x}px;top:${y}px;--dl:${i * .4}s`, $('sparkles')));

  for (let i = 0; i < 9; i++) {
    mk('fp', `left:${(i * 47 + 20) % 400}px;--t:${7 + (i % 4)}s;--dl:${3 + i * 1.1}s;` +
             `--dx:${(i % 2 ? 1 : -1) * (30 + i * 6)}px`, $('fall'));
  }

  // ----- replay button -----
  let turns = 0;
  function bloom() {
    stage.classList.remove('go');
    void stage.offsetWidth;                         // restart the animations
    requestAnimationFrame(() => stage.classList.add('go'));
  }
  $('again').addEventListener('click', () => {
    turns += 360;
    $('ic').style.rotate = turns + 'deg';
    bloom();
  });

  // ----- fit to small screens -----
  function fit() {
    const s = Math.min(1, (innerWidth - 24) / 420, (innerHeight - 90) / 570);
    document.documentElement.style.setProperty('--fit', Math.max(.4, s));
  }
  addEventListener('resize', fit);
  fit();
  setTimeout(bloom, 150);
})();
</script>
</body>
</html>
